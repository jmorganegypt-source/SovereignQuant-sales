name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies & build
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps
          npm run build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: https://sovereignquant.com.au
          PUBLIC_URL: "."
